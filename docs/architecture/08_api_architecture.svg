<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="835" viewBox="0 0 1440 835" role="img" aria-labelledby="title desc">
<title id="title">Implemented API and protocol boundaries</title>
<desc id="desc">Local demo interfaces and production entry points are distinct. The MCP lane is a real stdio subset; local in-process dispatch is a separate interface.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53808d"/></marker></defs>
<rect width="1440" height="835" rx="18" fill="#f3f6fa"/>
<g font-family="Arial, sans-serif">
<text x="40" y="52" font-size="32" font-weight="700" fill="#142b43">Implemented API and protocol boundaries</text>
<text x="40" y="87" font-size="19" fill="#536477">Local demo interfaces and production entry points are distinct</text>
<text x="40" y="131" font-size="17" font-weight="700" fill="#18796e">PRODUCTION MANAGEMENT</text>
<g data-node="n0_0"><rect x="40.0" y="153" width="316.0" height="134" rx="10" fill="#fff" stroke="#c8d5df"/>
<rect x="40.0" y="153" width="5" height="134" rx="2" fill="#18796e"/>
