<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">Human-governed quality and evaluation</title>
<desc id="desc">Operational feedback and public experiments have separate result sets. Policy approval is not automatic deployment. The paired experiment measures the public synthetic task set.</desc>
